# Knowledge graph: one assertion, under stated conditions.
#
# A claim is the unit the graph is actually made of. `subject predicate object`
# is the statement; everything else on this type exists to say when it holds and
# why anyone should believe it.
#
# `basis` is a FIELD, not a trust score. A documented claim
# and an observed claim are different kinds of thing, and collapsing them into
# one confidence number is how a vendor's marketing page ends up outranking a
# test result.
type: claim
displayName: Claim
displayNamePlural: Claims
icon: forum
color: "#f59e0b"

modes:
  inline: true
  fullDocument: true

sharing: personal
draftByDefault: false

idPrefix: clm
idFormat: ulid

fields:
  - name: title
    type: string
    required: true

  - name: status
    type: select
    default: asserted
    options:
      - value: asserted
        label: Asserted
        icon: check_circle
        category: started
      - value: draft
        label: Draft
        icon: edit_note
        category: unstarted
      - value: disputed
        label: Disputed
        icon: report
        category: started
      - value: superseded
        label: Superseded
        icon: history
        category: done
      - value: withdrawn
        label: Withdrawn
        icon: undo
        category: cancelled

  - name: subject
    type: relationship
    relationshipTypeKey: about
    targetTrackerTypes:
      - entity
    multiValue: false

  # The verb, by id, from the project's predicate registry (predicates.yaml).
  #
  # `predicate-ref` rather than a plain string: the registry is synced data, not
  # part of this type, so a project can add a verb without redefining claim --
  # but a typo in an unchecked string produces a statement that validates and
  # means nothing, which is worse than a rejection. Not a select for the same
  # reason: the option list would freeze at whatever was defined first.
  - name: predicate
    type: predicate-ref

  # The object of the statement, when it is an entity. Predicates whose
  # `valueShape` is not `entity` use `valueText` instead; the registry says
  # which, and only one of the two is ever filled in.
  - name: object
    type: relationship
    relationshipTypeKey: states
    targetTrackerTypes:
      - entity
    multiValue: false

  - name: valueText
    type: text
    displayInline: false

  # Per-edge detail whose shape the predicate declares -- `via`, `operations`,
  # `authentication`, and so on. Free-form here; the predicate registry is what
  # validates it at write time.
  - name: qualifiers
    type: object
    displayInline: false

  - name: basis
    type: select
    default: documented
    options:
      - value: documented
        label: Documented
        icon: menu_book
      - value: observed
        label: Observed
        icon: science
      - value: decision
        label: Decision
        icon: gavel
      - value: inference
        label: Inference
        icon: psychology

  # When the claim holds. A claim with no stated conditions is a claim nobody
  # can safely reuse in a different context, which is the failure the whole
  # scope model exists to avoid.
  - name: applicability
    type: text
    displayInline: false

  - name: citations
    type: citation
    multiValue: true
    displayInline: false

  - name: supersedes
    type: relationship
    relationshipTypeKey: supersedes
    targetTrackerTypes:
      - claim
    multiValue: false

  - name: tags
    type: array
    itemType: string
    displayInline: false

  - name: created
    type: datetime
    displayInline: false
    readOnly: true

  - name: updated
    type: datetime
    displayInline: false
    readOnly: true

statusBarLayout:
  - row:
    - field: status
      width: 160
    - field: basis
      width: 160
    - field: predicate
      width: 220

inlineTemplate: "{icon} {title}"

roles:
  title: title
  workflowStatus: status
  tags: tags
