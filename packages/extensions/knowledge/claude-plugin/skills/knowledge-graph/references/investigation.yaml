# Knowledge graph: one attempt at a question.
#
# Separate from `finding` because attempts outnumber answers and most of them
# fail. `outcome: inconclusive` and `reusedFindings` are the two that pay for
# this type existing: they are how the graph can say "this was already tried"
# and "this did not need trying again".
type: investigation
displayName: Investigation
displayNamePlural: Investigations
icon: science
color: "#8b5cf6"

modes:
  inline: true
  fullDocument: true

sharing: personal
draftByDefault: false

idPrefix: inv
idFormat: ulid

fields:
  - name: title
    type: string
    required: true

  - name: status
    type: select
    default: running
    options:
      - value: running
        label: Running
        icon: play_circle
        category: started
      - value: planned
        label: Planned
        icon: schedule
        category: unstarted
      - value: complete
        label: Complete
        icon: check_circle
        category: done
      - value: abandoned
        label: Abandoned
        icon: cancel
        category: cancelled

  - name: question
    type: relationship
    relationshipTypeKey: investigates
    targetTrackerTypes:
      - question
    multiValue: false

  # Versions, platform, configuration. The reason a later reader can tell
  # whether this attempt's outcome still applies to them.
  - name: environment
    type: object
    displayInline: false

  - name: attempts
    type: text
    displayInline: false

  - name: outcome
    type: select
    default: inconclusive
    options:
      - value: answered
        label: Answered
        icon: check_circle
      - value: inconclusive
        label: Inconclusive
        icon: help
      - value: blocked
        label: Blocked
        icon: block
      - value: refuted
        label: Refuted
        icon: do_not_disturb_on

  - name: reusedFindings
    type: relationship
    relationshipTypeKey: reused
    targetTrackerTypes:
      - finding
    multiValue: true

  - name: tags
    type: array
    itemType: string
    displayInline: false

  - name: created
    type: datetime
    displayInline: false
    readOnly: true

  - name: updated
    type: datetime
    displayInline: false
    readOnly: true

statusBarLayout:
  - row:
    - field: status
      width: 160
    - field: outcome
      width: 180

inlineTemplate: "{icon} {title}"

roles:
  title: title
  workflowStatus: status
  tags: tags
