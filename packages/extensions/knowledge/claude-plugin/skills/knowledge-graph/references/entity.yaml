# Knowledge graph: the base kind.
#
# An entity is anything with stable identity that statements can be made ABOUT.
# It deliberately carries almost no domain meaning: the domain lives in its
# `labels` and in the claims that point at it, not in a per-domain tracker type,
# so relationship fields can target `entity` and never restate a list of types.
#
# `labels` is how a product, a feature or a protocol tell themselves apart; a
# new domain adds a label to the label registry, not a field or option here.
# `kind` is the older single-valued axis, still read as an implicit label.
# Structure pages (area, home) keep writing it until the wiki reads label roles.
type: entity
displayName: Entity
displayNamePlural: Entities
icon: category
color: "#0ea5e9"

modes:
  inline: true
  fullDocument: true

sharing: personal
draftByDefault: false

idPrefix: ent
idFormat: ulid

fields:
  - name: title
    type: string
    required: true

  # The legacy ontology axis, read as an implicit label. Frozen: new pages set
  # `labels` instead, except structure pages (area, home). No default, so a page
  # that sets only `labels` does not pick up a kind it never had.
  - name: kind
    type: select
    options:
      - value: product
        label: Product
        icon: inventory_2
      - value: capability
        label: Capability
        icon: bolt
      - value: connector
        label: Connector
        icon: cable
      - value: configured-target
        label: Configured target
        icon: settings_ethernet
      - value: protocol
        label: Protocol
        icon: swap_horiz
      - value: format
        label: Format
        icon: description
      - value: technology
        label: Technology
        icon: memory
      - value: organization
        label: Organization
        icon: apartment
      # A category node in the market tree. Products join one with an
      # `in-market` claim; submarkets set `parent` to their market.
      - value: market
        label: Market
        icon: storefront
      # A synthesis or overview page (a landscape, a strategy, a practice).
      - value: topic
        label: Topic
        icon: topic
      - value: person
        label: Person
        icon: person
      - value: concept
        label: Concept
        icon: lightbulb
      - value: area
        label: Area
        icon: folder
      - value: home
        label: Home
        icon: home

  # Labels from the project's label registry (.nimbalyst/labels.yaml). A page
  # may carry several; each brings its properties. `kind` above is still read
  # as an implicit label, so existing pages need no migration.
  - name: labels
    type: label-ref
    multiValue: true
    displayInline: false

  - name: status
    type: select
    default: active
    options:
      - value: active
        label: Active
        icon: check_circle
        category: started
      - value: proposed
        label: Proposed
        icon: pending
        category: unstarted
      - value: superseded
        label: Superseded
        icon: history
        category: done
      - value: retired
        label: Retired
        icon: archive
        category: cancelled

  # The wiki hierarchy: an area, subarea or page points at the entity it sits
  # under. Top-level areas have no parent. Built from links, not folders.
  - name: parent
    type: relationship
    relationshipTypeKey: part-of
    targetTrackerTypes:
      - entity
    multiValue: false

  # Labels never identify anything so the names a thing
  # goes by are data, not identity. Search and the upstream importer both read
  # this rather than fuzzy-matching titles.
  - name: aliases
    type: array
    itemType: string
    displayInline: false

  # Which scope this record belongs to. Read-only: it is assigned by where the
  # record lives, never typed. Empty means the personal scope (`me:`).
  - name: scopeId
    type: string
    readOnly: true
    displayInline: false

  - name: reviewState
    type: select
    default: unreviewed
    displayInline: false
    options:
      - value: unreviewed
        label: Unreviewed
        icon: radio_button_unchecked
      - value: reviewed
        label: Reviewed
        icon: verified
      - value: disputed
        label: Disputed
        icon: report

  - name: summary
    type: text
    displayInline: false

  # Not time-varying, so a field rather than a claim. Facts that change
  # (revenue, pricing, users) are dated claims instead.
  - name: website
    type: string
    displayInline: false

  - name: tags
    type: array
    itemType: string
    displayInline: false

  - name: created
    type: datetime
    displayInline: false
    readOnly: true

  - name: updated
    type: datetime
    displayInline: false
    readOnly: true

# Not here yet, and deliberately: `externalRefs`. It needs an `external-ref`
# field type and a per-project scope resolver that do not exist yet. Adding a
# plain string field in the meantime would create references nothing validates.

statusBarLayout:
  - row:
    - field: kind
      width: 180
    - field: status
      width: 160
    - field: reviewState
      width: 160

inlineTemplate: "{icon} {title}"

roles:
  title: title
  workflowStatus: status
  tags: tags
