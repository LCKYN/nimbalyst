# Knowledge graph: a goal with constraints and success criteria.
#
# One type, not one type per question. A tracker type per question would make
# every relationship field enumerate question types by name and turn adding a
# question into a schema change. Here a question is an item.
type: question
displayName: Question
displayNamePlural: Questions
icon: help
color: "#6366f1"

modes:
  inline: true
  fullDocument: true

sharing: personal
draftByDefault: false

idPrefix: qst
idFormat: ulid

fields:
  - name: title
    type: string
    required: true

  - name: status
    type: select
    default: open
    options:
      - value: open
        label: Open
        icon: radio_button_unchecked
        category: unstarted
      - value: investigating
        label: Investigating
        icon: search
        category: started
      - value: answered
        label: Answered for now
        icon: check_circle
        category: done
      - value: blocked
        label: Blocked
        icon: block
        category: started
      - value: deferred
        label: Deferred
        icon: schedule
        category: backlog
      - value: abandoned
        label: Abandoned
        icon: cancel
        category: cancelled
      - value: reopened
        label: Reopened
        icon: replay
        category: started

  # Accountability is independent of the authority to adopt an answer.
  - name: owner
    type: user

  - name: timeframe
    type: text

  # Answer deadline. Review date is deliberately a separate field and role.
  - name: targetDate
    type: date

  - name: reviewDate
    type: date

  - name: priority
    type: select
    options:
      - value: low
        label: Low
      - value: medium
        label: Medium
      - value: high
        label: High
      - value: critical
        label: Critical

  - name: priorityRationale
    type: text
    displayInline: false

  - name: confidence
    type: select
    default: unknown
    options:
      - value: unknown
        label: Unknown
      - value: low
        label: Low
      - value: medium
        label: Medium
      - value: high
        label: High

  - name: confidenceBasis
    type: text
    displayInline: false

  - name: confidenceAssessedBy
    type: user

  - name: confidenceAssessedAt
    type: date

  - name: position
    type: text
    displayInline: false

  - name: positionAsOf
    type: date

  # Question progress never implies acceptance of a position.
  - name: positionState
    type: select
    default: none
    options:
      - value: none
        label: None
      - value: proposed
        label: Proposed
      - value: accepted
        label: Accepted
      - value: rejected
        label: Rejected
      - value: superseded
        label: Superseded

  - name: decidedBy
    type: user

  - name: decidedAt
    type: date

  - name: decisionScope
    type: text
    displayInline: false

  - name: answerFormat
    type: select
    options:
      - value: yes-no
        label: Yes / No
      - value: choose-option
        label: Choose an option
      - value: prioritize
        label: Prioritize
      - value: open
        label: Open answer

  - name: revisitWhen
    type: text
    displayInline: false

  # What would count as an answer, and what the answer has to hold for. Without
  # this a finding cannot state its own scope honestly, because nobody wrote
  # down what was being asked.
  - name: constraints
    type: text
    displayInline: false

  - name: subjects
    type: relationship
    relationshipTypeKey: concerns
    targetTrackerTypes:
      - entity
    multiValue: true

  # A sub-question points at the question it helps answer.
  - name: parent
    type: relationship
    relationshipTypeKey: sub-question-of
    targetTrackerTypes:
      - question
    multiValue: false

  - name: answers
    type: relationship
    relationshipTypeKey: answered-by
    targetTrackerTypes:
      - finding
    multiValue: true

  - name: tags
    type: array
    itemType: string
    displayInline: false

  - name: created
    type: datetime
    displayInline: false
    readOnly: true

  - name: updated
    type: datetime
    displayInline: false
    readOnly: true

statusBarLayout:
  - row:
    - field: status
      width: 180

inlineTemplate: "{icon} {title}"

roles:
  title: title
  workflowStatus: status
  assignee: owner
  priority: priority
  dueDate: targetDate
  tags: tags
