# Knowledge graph predicate pack: spec (opt-in).
#
# Structure and provenance for spec pages. The provenance predicates point a
# page at real sources: the files that implement it (`implemented-in`), the
# decision items that govern it (`governed-by`), and the sessions where it was
# worked out (`discussed-in`). They are claims rather than fields because they
# change with the code and need a date and a source. Needs the core pack.
predicates:
  - id: part-of-subsystem
    label: is part of
    inverseLabel: contains
    subjectKinds: [entity]
    valueShape: entity
    direction: directed
    transitive: true

  # valueText is a repository path or glob ("src/sync/**"). Several paths are
  # several claims. Re-point it with a new claim when the code moves.
  - id: implemented-in
    label: is implemented in
    inverseLabel: implements
    subjectKinds: [entity]
    valueShape: text
    direction: directed
    qualifiers:
      commit:
        type: string
        label: Commit
        description: The commit the path was checked against.
      repo:
        type: string
        label: Repository
        description: The repository, when the project spans more than one.

  - id: stores-in
    label: stores data in
    inverseLabel: holds data for
    subjectKinds: [entity]
    valueShape: entity
    direction: directed
    qualifiers:
      what:
        type: string
        label: What
        description: The data kept there.

  - id: exposed-on
    label: is exposed on
    inverseLabel: exposes
    subjectKinds: [entity]
    valueShape: entity
    direction: directed

  # valueText is the decision's issue key or title; `citations` links the
  # decision item itself, which is a tracker item of another type.
  - id: governed-by
    label: is governed by
    inverseLabel: governs
    subjectKinds: [entity]
    valueShape: text
    direction: directed

  - id: upholds
    label: upholds
    inverseLabel: is upheld by
    subjectKinds: [entity]
    valueShape: entity
    direction: directed

  - id: violates
    label: violates
    inverseLabel: is violated by
    subjectKinds: [entity]
    valueShape: entity
    direction: directed
    qualifiers:
      issue:
        type: string
        label: Issue
        description: The bug that tracks the breach.

  # valueText is the session id.
  - id: discussed-in
    label: was discussed in
    inverseLabel: discussed
    subjectKinds: [entity]
    valueShape: text
    direction: directed
    qualifiers:
      sessionTitle:
        type: string
        label: Session
      date:
        type: date
        label: Date
