# Knowledge graph: a scoped answer, resting on exact claims.
#
# A finding is the reusable artifact -- the thing a second agent retrieves
# instead of redoing the work. Two fields are what make it reusable rather than
# merely readable: `scope` says where the answer holds, and `limitations` says
# where it does not. An answer with neither is a sentence, not a finding.
type: finding
displayName: Finding
displayNamePlural: Findings
icon: lightbulb
color: "#10b981"

modes:
  inline: true
  fullDocument: true

sharing: personal
draftByDefault: false

idPrefix: fnd
idFormat: ulid

fields:
  - name: title
    type: string
    required: true

  - name: status
    type: select
    default: draft
    options:
      - value: draft
        label: Draft
        icon: edit_note
        category: unstarted
      - value: asserted
        label: Asserted
        icon: check_circle
        category: started
      - value: superseded
        label: Superseded
        icon: history
        category: done
      - value: withdrawn
        label: Withdrawn
        icon: undo
        category: cancelled

  - name: question
    type: relationship
    relationshipTypeKey: answers
    targetTrackerTypes:
      - question
    multiValue: false

  # Pinned to exact revisions through each relationship value's `revisionId`,
  # so a finding keeps saying what it said even after the
  # claims underneath it move. An upstream change surfaces as a notice, never as
  # a silent re-point.
  - name: claims
    type: relationship
    relationshipTypeKey: rests-on
    targetTrackerTypes:
      - claim
    multiValue: true

  - name: scope
    type: text
    displayInline: false

  - name: limitations
    type: text
    displayInline: false

  - name: supersedes
    type: relationship
    relationshipTypeKey: supersedes
    targetTrackerTypes:
      - finding
    multiValue: false

  - name: tags
    type: array
    itemType: string
    displayInline: false

  - name: created
    type: datetime
    displayInline: false
    readOnly: true

  - name: updated
    type: datetime
    displayInline: false
    readOnly: true

statusBarLayout:
  - row:
    - field: status
      width: 180

inlineTemplate: "{icon} {title}"

roles:
  title: title
  workflowStatus: status
  tags: tags
