# knowledge-core: the base kind.
#
# An entity is anything with stable identity that statements can be made ABOUT.
# It deliberately carries almost no domain meaning: the domain lives in `kind`
# and in the claims that point at it, not in a per-domain tracker type. That is
# the whole difference from the `kg-*` experiment this replaces, where every
# question got its own type and every relationship field had to restate the
# full list of target types.
#
# Domain packs refine this with `extends: entity` (master plan 4.1). Until the
# pack installer lands, `kind` is how a product, a capability or a protocol tell
# themselves apart.
type: entity
displayName: Entity
displayNamePlural: Entities
icon: category
color: "#0ea5e9"

modes:
  inline: true
  fullDocument: true

sharing: personal
draftByDefault: false

idPrefix: ent
idFormat: ulid

fields:
  - name: title
    type: string
    required: true

  # The ontology axis. A reader asking "what enumerated values exist here" is
  # asking about THIS field more than any other, which is why it is second.
  - name: kind
    type: select
    default: concept
    options:
      - value: product
        label: Product
        icon: inventory_2
      - value: capability
        label: Capability
        icon: bolt
      - value: connector
        label: Connector
        icon: cable
      - value: configured-target
        label: Configured target
        icon: settings_ethernet
      - value: protocol
        label: Protocol
        icon: swap_horiz
      - value: format
        label: Format
        icon: description
      - value: technology
        label: Technology
        icon: memory
      - value: organization
        label: Organization
        icon: apartment
      - value: person
        label: Person
        icon: person
      - value: concept
        label: Concept
        icon: lightbulb

  - name: status
    type: select
    default: active
    options:
      - value: active
        label: Active
        icon: check_circle
        category: started
      - value: proposed
        label: Proposed
        icon: pending
        category: unstarted
      - value: superseded
        label: Superseded
        icon: history
        category: done
      - value: retired
        label: Retired
        icon: archive
        category: cancelled

  # Labels never identify anything (master plan rule 1), so the names a thing
  # goes by are data, not identity. Search and the upstream importer both read
  # this rather than fuzzy-matching titles.
  - name: aliases
    type: array
    itemType: string
    displayInline: false

  # Which scope this record belongs to. Read-only: it is assigned by where the
  # record lives, never typed. Empty means the personal scope (`me:`).
  - name: scopeId
    type: string
    readOnly: true
    displayInline: false

  - name: reviewState
    type: select
    default: unreviewed
    displayInline: false
    options:
      - value: unreviewed
        label: Unreviewed
        icon: radio_button_unchecked
      - value: reviewed
        label: Reviewed
        icon: verified
      - value: disputed
        label: Disputed
        icon: report

  - name: summary
    type: text
    displayInline: false

  - name: tags
    type: array
    itemType: string
    displayInline: false

  - name: created
    type: datetime
    displayInline: false
    readOnly: true

  - name: updated
    type: datetime
    displayInline: false
    readOnly: true

# Not here yet, and deliberately: `externalRefs`. It needs the `external-ref`
# field type and the per-project scope resolver (master plan 4.3, N9). Adding a
# plain string field in the meantime would create references nothing validates,
# which is the failure rule 2 exists to prevent.

statusBarLayout:
  - row:
    - field: kind
      width: 180
    - field: status
      width: 160
    - field: reviewState
      width: 160

inlineTemplate: "{icon} {title}"

roles:
  title: title
  workflowStatus: status
  tags: tags
