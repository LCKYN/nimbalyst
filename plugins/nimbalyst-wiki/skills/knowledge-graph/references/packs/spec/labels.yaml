# worked out. Needs the core pack. Its predicates are in `predicates.yaml` next
# to this file; it also uses the core pack's `depends-on` and `integrates-with`.
#
# These labels are for knowledge-graph pages. A project may also have tracker
# TYPES with similar names (a `feature` tracker for planned work); those are
# work items, not spec pages, and nothing here touches them.
