# FIELD-stored: current value only, kept on the page.
properties:
  - id: surface
    label: Surface
    type: multiselect
    options: [desktop, web, mobile, cli, server]
    facet: true
    description: Where it is available.

  - id: flag
    label: Flag
    type: string
    description: The feature flag or setting that gates it, if any.
    qualifiers:
      defaultState:
        type: select
        options: ["on", "off"]
        label: Default
        description: Whether the flag is on for a new install.

  - id: stage
    label: Stage
    type: select
    options: [planned, alpha, beta, stable, deprecated, removed]
    facet: true
    description: How far along it is. A change of stage worth remembering belongs in a decision, not here.

  - id: requirement-level
    label: Level
    type: select
    options: [must, should, may]
    facet: true

  - id: enforcement
    label: Enforcement
    type: multiselect
    options: [test, runtime-check, review, convention]
    description: What keeps the rule true. Convention alone means nothing checks it.

  - id: engine
    label: Engine
    type: string
    description: The storage technology, when the choice matters.

# Keys `predicates.yaml` cannot carry yet, keyed by predicate id.
claimProperties:
  part-of-subsystem:
    range: [subsystem]
    facet: true
  stores-in:
    range: [data-store]
  exposed-on:
    range: [surface]
  upholds:
    range: [invariant, requirement]
  violates:
    range: [invariant, requirement]
