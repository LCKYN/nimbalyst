# Knowledge graph predicate pack: market (opt-in).
#
# Market, maker and competition relationships, and dated facts about
# organizations and products. Needs the core pack.
#
# "Competitor" is a relationship, not a location: the project competes with a
# product IN a market, at a threat level that belongs to that market.
predicates:
  - id: in-market
    label: is in market
    inverseLabel: includes
    subjectKinds: [entity]
    valueShape: entity
    direction: directed
    qualifiers:
      primary:
        type: boolean
        label: Primary
        description: The market the product is mainly known for.

  - id: made-by
    label: is made by
    inverseLabel: makes
    subjectKinds: [entity]
    valueShape: entity
    direction: directed

  - id: competes-with
    label: competes with
    inverseLabel: competes with
    subjectKinds: [entity]
    valueShape: entity
    direction: symmetric
    qualifiers:
      market:
        type: relationship
        targetTrackerTypes: [entity]
        label: Market
        description: "The market (a page labeled market) this competition is in. Threat is per market."
      threat:
        type: select
        options: [low, medium, high, critical]
        label: Threat
      overlap:
        type: string
        label: Overlap
      difference:
        type: string
        label: Difference
      reviewedAt:
        type: date
        label: Reviewed

  # --- Dated facts ----------------------------------------------------------
  #
  # A fact is a claim, not a field, because it changes and needs a date and a
  # source. `asOf` is required (`asOfPrecision` says whether it is a day, month
  # or year; a month is stored as its first day); the display value goes in
  # `claim.valueText`; quantity facts also carry `amount` and `unit` (USD,
  # people, users, seats); sources go in `claim.citations`. The current value is
  # the latest `asOf` among asserted claims. Organization facts: annual-revenue,
  # funding-total, valuation, last-round, headcount, founded, hq. Product facts:
  # pricing, license, platforms, launched, users, lifecycle.

  - id: annual-revenue
    label: annual revenue
    inverseLabel: annual revenue of
    subjectKinds: [entity]
    valueShape: quantity
    direction: directed
    qualifiers: &quantityFact
      asOf:
        type: date
        required: true
        label: As of
        description: When the value was true. The current value is the latest asOf among asserted claims.
      asOfPrecision: &asOfPrecision
        type: select
        options: [day, month, year]
        label: As-of precision
        description: How precise asOf is. Absent means day. A month-precision date is the first of the month.
      amount:
        type: number
        label: Amount
        description: The number behind valueText, in `unit`.
      unit:
        type: string
        label: Unit
        description: USD, people, users, or seats.

  - id: funding-total
    label: total funding
    inverseLabel: total funding of
    subjectKinds: [entity]
    valueShape: quantity
    direction: directed
    qualifiers: *quantityFact

  - id: valuation
    label: valuation
    inverseLabel: valuation of
    subjectKinds: [entity]
    valueShape: quantity
    direction: directed
    qualifiers: *quantityFact

  - id: last-round
    label: last round
    inverseLabel: last round of
